<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشهد بيان — تصميم قابل للتعديل</title>
  <style>
    :root {
      --page-bg: #000;
      --sky-top: #b9b0a5;
      --sky-bottom: #d1c2ad;
      --sea-top: #111b2e;
      --sea-bottom: #080d18;
      --text-color: #f4f1ed;
      --ui-muted: #bfc0c4;
      --poem-size: clamp(22px, 3vw, 44px);
      --corner-radius: 8px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      background: var(--page-bg);
      color: var(--text-color);
      font-family: Arial, Tahoma, sans-serif;
      overflow-x: hidden;
    }

    .top-bar {
      height: 28px;
      background: #f8f8f8;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
    }
    .viewer {
      position: relative;
      min-height: calc(100vh - 28px);
      background: #000;
      padding: 54px 8% 48px 8%;
    }
    .top-controls {
      position: absolute;
      top: 8px;
      right: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      direction: ltr;
    }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: #e8e9ec; color: #111;
      display: grid; place-items: center;
      font-size: 19px; font-weight: bold;
      border: 0;
    }
    .facebook-mark {
      background: #0866ff; color: white; font: bold 30px Arial;
      align-items: end; overflow: hidden; padding-top: 4px;
    }
    .close-mark { font-size: 30px; font-weight: 300; }

    .scene {
      position: relative;
      width: 100%;
      max-width: 1220px;
      aspect-ratio: 1.6 / 1;
      margin: 0 auto;
      overflow: hidden;
      border-radius: var(--corner-radius);
      isolation: isolate;
      background: linear-gradient(var(--sky-top) 0%, var(--sky-bottom) 77%, var(--sea-top) 77.2%, var(--sea-bottom) 100%);
    }
    /* طبقة حبيبات خفيفة لإحساس اللقطة المصوّرة */
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .12;
      background-image: radial-gradient(#fff 0.5px, transparent .8px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
    }
    .horizon-glow {
      position: absolute; left: 0; right: 0; top: 68%;
      height: 12%; background: linear-gradient(transparent, rgba(255,255,255,.14), transparent);
    }
    .sea {
      position: absolute; left: 0; right: 0; bottom: 0; height: 22.8%;
      background:
        repeating-linear-gradient(176deg, transparent 0 9px, rgba(210,220,235,.12) 10px, transparent 12px 22px),
        linear-gradient(180deg, #172238, #070b14);
    }
    .sea::before {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(4deg, transparent 0 18px, rgba(0,0,0,.18) 19px 21px);
    }

    .poem {
      position: absolute;
      z-index: 2;
      top: 35%;
      left: 19%;
      width: 62%;
      text-align: center;
      color: rgba(54, 48, 42, .82);
      font-family: "Amiri", "Noto Naskh Arabic", Tahoma, serif;
      font-size: var(--poem-size);
      line-height: 1.8;
      text-shadow: 0 1px 2px rgba(255,255,255,.15);
      transform: rotate(-1deg);
    }
    .poem p { margin: 0 0 12px; }
    .signature {
      position: absolute; top: 5%; right: 5%;
      z-index: 2; color: rgba(45,39,34,.8);
      font-family: "Amiri", Tahoma, serif; font-size: clamp(22px, 2.6vw, 36px);
    }

    .bird {
      position: absolute;
      z-index: 2;
      width: 42px; height: 22px;
      background: #211d1a;
      clip-path: polygon(0 40%, 23% 27%, 43% 48%, 58% 20%, 82% 0, 100% 12%, 76% 34%, 59% 64%, 44% 56%, 30% 83%, 18% 52%);
      filter: blur(.7px);
      transform: rotate(-8deg);
    }
    .b1 { top: 4%; left: 72%; width: 32px; height: 16px; transform: rotate(12deg); opacity: .55; }
    .b2 { top: 22%; left: 74%; width: 70px; height: 36px; transform: rotate(-15deg); }
    .b3 { top: 57%; left: 48%; width: 54px; height: 30px; transform: rotate(22deg); }
    .b4 { top: 55%; left: 66%; width: 62px; height: 32px; transform: rotate(-24deg); }
    .b5 { top: 60%; left: 89%; width: 58px; height: 31px; transform: rotate(-12deg); }
    .b6 { top: 66%; left: 59%; width: 36px; height: 19px; transform: rotate(16deg); opacity: .65; }
    .b7 { top: 21%; left: 56%; width: 32px; height: 16px; transform: rotate(5deg); opacity: .65; }

    .boat {
      position: absolute; z-index: 2; bottom: 20%; left: 72%;
      width: 55px; height: 18px; background: #252b36;
      clip-path: polygon(0 52%, 35% 44%, 52% 0, 72% 20%, 100% 76%, 20% 90%);
      filter: blur(1px);
    }
    .far-ship {
      position: absolute; z-index: 2; bottom: 20%; right: 0;
      width: 40px; height: 26px; background: rgba(83,91,88,.55);
      clip-path: polygon(0 35%, 45% 25%, 52% 0, 68% 22%, 100% 32%, 100% 100%, 0 100%);
    }

    .social-caption {
      position: absolute; z-index: 3; bottom: 3%; right: 1.5%;
      max-width: 50%; text-align: right;
      font-size: clamp(10px, 1vw, 14px);
      line-height: 1.8; color: rgba(255,255,255,.92);
      text-shadow: 0 1px 3px #000;
    }
    .social-caption strong { font-size: 1.05em; }
    .side-actions {
      position: absolute; left: 10px; top: 47%;
      display: flex; flex-direction: column; gap: 12px;
      color: #eee; align-items: center; z-index: 4;
    }
    .action-circle {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #9da0a4; color: #ddd;
      display: grid; place-items: center; font-size: 23px;
    }
    .side-label { font-size: 12px; text-align: center; line-height: 1.3; }
    .side-label span { display: block; font-size: 11px; }

    @media (max-width: 700px) {
      .viewer { padding: 58px 12px 30px; }
      .scene { aspect-ratio: 1 / 1.12; }
      .poem { top: 34%; left: 5%; width: 90%; font-size: clamp(19px, 5vw, 29px); }
      .signature { font-size: 23px; }
      .top-controls { right: 10px; left: 10px; }
      .circle { width: 34px; height: 34px; }
      .social-caption { max-width: 72%; }
      .side-actions { left: 4px; top: auto; bottom: 20px; }
      .action-circle { width: 34px; height: 34px; border-width: 3px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <span>Facebook - فيسبوك</span>
    <span>↻　➜　●</span>
  </header>

  <main class="viewer">
    <nav class="top-controls" aria-label="عناصر التحكم">
      <div class="control-group">
        <div class="circle" title="الملف الشخصي">●</div>
        <div class="circle" title="الإشعارات">♟</div>
        <div class="circle" title="الرسائل">◉</div>
        <div class="circle" title="القائمة">▦</div>
      </div>
      <div class="control-group">
        <div class="circle facebook-mark">f</div>
        <div class="circle close-mark">×</div>
      </div>
    </nav>

    <section class="scene" aria-label="سماء وبحر وطيور وأبيات شعر">
      <div class="horizon-glow"></div>
      <div class="sea"></div>
      <div class="signature">بيان</div>

      <div class="bird b1"></div>
      <div class="bird b2"></div>
      <div class="bird b3"></div>
      <div class="bird b4"></div>
      <div class="bird b5"></div>
      <div class="bird b6"></div>
      <div class="bird b7"></div>
      <div class="boat"></div>
      <div class="far-ship"></div>

      <div class="poem">
        <p>يا ليتني كنتُ طيرًا في العراء</p>
        <p>فلا قيدٌ عليَّ ولا الآثامُ تحويني</p>
      </div>

      <div class="social-caption">
        <strong>بيان · متابعة</strong><br>
        بيان · المقطع الصوتي الأصلي<br>
        يا ليتني كنت طيرًا في العراء ... عرض المزيد
      </div>
    </section>

    <aside class="side-actions" aria-label="تفاعلات">
      <div class="action-circle">⌃</div>
      <div class="action-circle">⌄</div>
      <div class="side-label">♧<span>٤٧٣</span></div>
      <div class="side-label">◯<span>١٢</span></div>
      <div class="side-label">↗<span>٤٣</span></div>
      <div class="side-label">•••</div>
    </aside>
  </main>
</body>
</html>
